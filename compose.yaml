services:
  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    env_file: .env.production

  web:
    profiles: [selfhost]
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"

  caddy:
    profiles: [selfhost]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
